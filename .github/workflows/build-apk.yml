name: Build SDR2HDR Akari APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME tidak tersedia"
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "ERROR: Android platform 35 tidak tersedia"
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          fi

          echo "Android SDK OK"
          ls -la "$ANDROID_HOME/platforms/android-35"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        shell: bash
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f | sort
          echo "=== GRADLE ==="
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDR2HDR-Akari-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
