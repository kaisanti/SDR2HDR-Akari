name: Build SDR2HDR Akari TEST 3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/maafyaburik/sdr2hdr
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SDR2HDR-Akari"
include(":app")
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maafyaburik.sdr2hdr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maafyaburik.sdr2hdr'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
}
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="false"
        android:supportsRtl="true"
        android:label="SDR2HDR Akari TEST 3"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#6750A4</item>
        <item name="android:navigationBarColor">#000000</item>

    </style>

</resources>
EOF

          cat > app/src/main/java/com/maafyaburik/sdr2hdr/MainActivity.java <<'EOF'
package com.maafyaburik.sdr2hdr;

import android.app.Activity;
import android.os.Bundle;
import android.os.Build;
import android.media.MediaCodecInfo;
import android.media.MediaCodecList;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

import java.lang.reflect.Field;

public class MainActivity extends Activity {

    private TextView log;

    @Override
    protected void onCreate(Bundle state) {
        super.onCreate(state);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(24, 24, 24, 24);

        TextView title = new TextView(this);

        title.setText(
            "SDR2HDR Akari\n" +
            "TEST 3 — 10-BIT HDR SCANNER"
        );

        title.setTextSize(22);

        root.addView(title);

        Button scan = new Button(this);

        scan.setText(
            "SCAN SEMUA 10-BIT / HDR ENCODER"
        );

        root.addView(scan);

        log = new TextView(this);
        log.setTextSize(14);

        ScrollView scroll = new ScrollView(this);

        scroll.addView(log);

        root.addView(
            scroll,
            new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                0,
                1
            )
        );

        setContentView(root);

        scan.setOnClickListener(
            v -> scanAll()
        );
    }

    private void println(String text) {

        runOnUiThread(
            () -> log.append(text + "\n")
        );
    }

    private boolean hasMime(
        MediaCodecInfo info,
        String mime
    ) {

        for (
            String type :
            info.getSupportedTypes()
        ) {

            if (
                mime.equalsIgnoreCase(type)
            ) {
                return true;
            }
        }

        return false;
    }

    private boolean hasSurface(
        MediaCodecInfo.CodecCapabilities caps
    ) {

        for (
            int format :
            caps.colorFormats
        ) {

            if (
                format ==
                MediaCodecInfo.CodecCapabilities
                    .COLOR_FormatSurface
            ) {

                return true;
            }
        }

        return false;
    }

    private Integer getProfileConstant(
        String name
    ) {

        try {

            Field field =
                MediaCodecInfo.CodecProfileLevel.class
                    .getField(name);

            return field.getInt(null);

        } catch (Throwable e) {

            return null;
        }
    }

    private boolean hasProfile(
        MediaCodecInfo.CodecCapabilities caps,
        String constantName
    ) {

        Integer wanted =
            getProfileConstant(
                constantName
            );

        if (wanted == null) {
            return false;
        }

        for (
            MediaCodecInfo.CodecProfileLevel p :
            caps.profileLevels
        ) {

            if (
                p.profile == wanted
            ) {

                return true;
            }
        }

        return false;
    }

    private void printProfiles(
        MediaCodecInfo.CodecCapabilities caps
    ) {

        println("Profile values:");

        if (
            caps.profileLevels == null ||
            caps.profileLevels.length == 0
        ) {

            println("  none");
            return;
        }

        for (
            MediaCodecInfo.CodecProfileLevel p :
            caps.profileLevels
        ) {

            println(
                "  profile=" +
                p.profile +
                " level=" +
                p.level
            );
        }
    }

    private void scanCodec(
        String mime
    ) {

        println("");
        println("==============================");
        println("CODEC: " + mime);
        println("==============================");

        boolean found = false;

        MediaCodecList list =
            new MediaCodecList(
                MediaCodecList.ALL_CODECS
            );

        for (
            MediaCodecInfo info :
            list.getCodecInfos()
        ) {

            if (!info.isEncoder()) {
                continue;
            }

            if (!hasMime(info, mime)) {
                continue;
            }

            found = true;

            println("");
            println(
                "Encoder: " +
                info.getName()
            );

            println(
                "Hardware accelerated: " +
                info.isHardwareAccelerated()
            );

            println(
                "Software only: " +
                info.isSoftwareOnly()
            );

            println(
                "Vendor: " +
                info.isVendor()
            );

            try {

                MediaCodecInfo.CodecCapabilities caps =
                    info.getCapabilitiesForType(mime);

                println(
                    "Surface input: " +
                    hasSurface(caps)
                );

                printProfiles(caps);

                if (
                    "video/av01"
                        .equalsIgnoreCase(mime)
                ) {

                    println("");
                    println("AV1:");

                    println(
                        "Main10: " +
                        hasProfile(
                            caps,
                            "AV1ProfileMain10"
                        )
                    );

                    println(
                        "Main10 HDR10: " +
                        hasProfile(
                            caps,
                            "AV1ProfileMain10HDR10"
                        )
                    );

                    println(
                        "Main10 HDR10+: " +
                        hasProfile(
                            caps,
                            "AV1ProfileMain10HDR10Plus"
                        )
                    );
                }

                if (
                    "video/apv"
                        .equalsIgnoreCase(mime)
                ) {

                    println("");
                    println("APV:");

                    println(
                        "422 10-bit: " +
                        hasProfile(
                            caps,
                            "APVProfile422_10"
                        )
                    );

                    println(
                        "422 10-bit HDR10: " +
                        hasProfile(
                            caps,
                            "APVProfile422_10HDR10"
                        )
                    );

                    println(
                        "422 10-bit HDR10+: " +
                        hasProfile(
                            caps,
                            "APVProfile422_10HDR10Plus"
                        )
                    );
                }

                if (
                    "video/x-vnd.on2.vp9"
                        .equalsIgnoreCase(mime)
                ) {

                    println("");
                    println("VP9:");

                    println(
                        "Profile 2 HDR10: " +
                        hasProfile(
                            caps,
                            "VP9Profile2HDR10"
                        )
                    );

                    println(
                        "Profile 2 HDR10+: " +
                        hasProfile(
                            caps,
                            "VP9Profile2HDR10Plus"
                        )
                    );
                }

                if (
                    "video/hevc"
                        .equalsIgnoreCase(mime)
                ) {

                    println("");
                    println("HEVC:");

                    println(
                        "Main10: " +
                        hasProfile(
                            caps,
                            "HEVCProfileMain10"
                        )
                    );

                    println(
                        "Main10 HDR10: " +
                        hasProfile(
                            caps,
                            "HEVCProfileMain10HDR10"
                        )
                    );

                    println(
                        "Main10 HDR10+: " +
                        hasProfile(
                            caps,
                            "HEVCProfileMain10HDR10Plus"
                        )
                    );
                }

            } catch (Throwable e) {

                println(
                    "Capability error: " +
                    e.getClass()
                        .getSimpleName() +
                    ": " +
                    e.getMessage()
                );
            }
        }

        if (!found) {

            println(
                "Encoder tidak ditemukan."
            );
        }
    }

    private void scanAll() {

        log.setText("");

        println(
            "================================"
        );

        println(
            "SDR2HDR AKARI TEST 3"
        );

        println(
            "10-BIT HDR ENCODER SCANNER"
        );

        println(
            "================================"
        );

        println(
            "Android API: " +
            Build.VERSION.SDK_INT
        );

        println(
            "Device: " +
            Build.MANUFACTURER +
            " " +
            Build.MODEL
        );

        println("");

        println(
            "Memeriksa AV1..."
        );

        scanCodec(
            "video/av01"
        );

        println("");

        println(
            "Memeriksa APV..."
        );

        scanCodec(
            "video/apv"
        );

        println("");

        println(
            "Memeriksa VP9..."
        );

        scanCodec(
            "video/x-vnd.on2.vp9"
        );

        println("");

        println(
            "Memeriksa HEVC..."
        );

        scanCodec(
            "video/hevc"
        );

        println("");

        println(
            "================================"
        );

        println(
            "SCAN SELESAI"
        );

        println(
            "================================"
        );

        println("");

        println(
            "Cari TRUE pada:"
        );

        println(
            "AV1 Main10"
        );

        println(
            "AV1 Main10 HDR10"
        );

        println(
            "APV 422 10-bit"
        );

        println(
            "APV 422 10-bit HDR10"
        );

        println(
            "VP9 Profile 2 HDR10"
        );

        println(
            "HEVC Main10"
        );
    }
}
EOF

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDR2HDR-Akari-TEST3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
