name: Build SDR2HDR Akari APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/maafyaburik/sdr2hdr
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SDR2HDR-Akari"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.maafyaburik.sdr2hdr'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.maafyaburik.sdr2hdr'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '0.1-test'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2E7D32</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="SDR2HDR Akari TEST 4"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/maafyaburik/sdr2hdr/MainActivity.java <<'EOF'
          package com.maafyaburik.sdr2hdr;

          import android.app.Activity;
          import android.os.Bundle;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.media.MediaFormat;
          import android.os.Build;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView log;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("SDR2HDR Akari\nTEST 4 — BUILD FIX");
                  title.setTextSize(27);
                  title.setTextColor(Color.DKGRAY);
                  title.setGravity(Gravity.CENTER_VERTICAL);
                  root.addView(title, new LinearLayout.LayoutParams(-1, 120));

                  Button scan = new Button(this);
                  scan.setText("1. CEK HEVC MAIN10 / HDR");
                  root.addView(scan);

                  Button test = new Button(this);
                  test.setText("2. TES ENCODER HDR10 / PQ");
                  root.addView(test);

                  log = new TextView(this);
                  log.setTextSize(16);
                  log.setTextColor(Color.DKGRAY);
                  log.setPadding(0, 20, 0, 0);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(log);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));

                  setContentView(root);

                  scan.setOnClickListener(v -> scanEncoders());
                  test.setOnClickListener(v -> testEncoder());
              }

              private void out(String s) {
                  log.append(s + "\n");
              }

              private void scanEncoders() {
                  log.setText("");
                  out("==========");
                  out("SDR2HDR AKARI TEST 4");
                  out("==========");
                  out("Android API: " + Build.VERSION.SDK_INT);
                  out("Device: " + Build.MANUFACTURER + " " + Build.MODEL);
                  out("");

                  MediaCodecList list = new MediaCodecList(MediaCodecList.ALL_CODECS);
                  for (MediaCodecInfo info : list.getCodecInfos()) {
                      if (info.isEncoder()) {
                          for (String type : info.getSupportedTypes()) {
                              if ("video/hevc".equalsIgnoreCase(type)) {
                                  MediaCodecInfo.CodecCapabilities c =
                                          info.getCapabilitiesForType(type);
                                  boolean surface = false;
                                  for (int f : c.colorFormats) {
                                      if (f == MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface) {
                                          surface = true;
                                      }
                                  }
                                  boolean main10 = false;
                                  boolean hdr10 = false;
                                  try {
                                      main10 = hasProfile(c.profileLevels,
                                              MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10);
                                  } catch (Throwable ignored) {}

                                  if (Build.VERSION.SDK_INT >= 29) {
                                      try {
                                          hdr10 = hasProfile(c.profileLevels,
                                              MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10HDR10);
                                      } catch (Throwable ignored) {}
                                  }

                                  out("HEVC Encoder: " + info.getName());
                                  out("Surface input: " + surface);
                                  out("Main10: " + main10);
                                  out("Main10 HDR10: " + hdr10);
                                  if (Build.VERSION.SDK_INT >= 33) {
                                      try {
                                          out("HDR editing: " +
                                              c.isFeatureSupported(
                                                  MediaCodecInfo.CodecCapabilities.FEATURE_HdrEditing));
                                      } catch (Throwable e) {
                                          out("HDR editing: false");
                                      }
                                  }
                                  out("");
                              }
                          }
                      }
                  }
                  out("SCAN SELESAI.");
              }

              private boolean hasProfile(MediaCodecInfo.CodecProfileLevel[] levels, int profile) {
                  if (levels == null) return false;
                  for (MediaCodecInfo.CodecProfileLevel p : levels) {
                      if (p.profile == profile) return true;
                  }
                  return false;
              }

              private void testEncoder() {
                  log.setText("");
                  out("================================");
                  out("TEST HDR10 / PQ");
                  out("================================");

                  MediaCodecInfo chosen = null;

                  MediaCodecList list = new MediaCodecList(MediaCodecList.ALL_CODECS);
                  for (MediaCodecInfo info : list.getCodecInfos()) {
                      if (!info.isEncoder()) continue;
                      for (String type : info.getSupportedTypes()) {
                          if (!"video/hevc".equalsIgnoreCase(type)) continue;
                          try {
                              MediaCodecInfo.CodecCapabilities c =
                                      info.getCapabilitiesForType(type);
                              boolean surface = false;
                              for (int f : c.colorFormats) {
                                  if (f == MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface) {
                                      surface = true;
                                  }
                              }
                              boolean main10 = hasProfile(c.profileLevels,
                                  MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10);
                              if (surface && main10) {
                                  chosen = info;
                                  break;
                              }
                          } catch (Throwable ignored) {}
                      }
                      if (chosen != null) break;
                  }

                  if (chosen == null) {
                      out("GAGAL:");
                      out("HEVC Main10 + Surface tidak tersedia.");
                      out("");
                      out("HASIL DEVICE: tidak ada jalur hardware");
                      out("untuk HEVC 10-bit HDR via MediaCodec.");
                      return;
                  }

                  out("Encoder: " + chosen.getName());

                  try {
                      android.media.MediaCodec codec =
                          android.media.MediaCodec.createByCodecName(chosen.getName());

                      MediaFormat f =
                          MediaFormat.createVideoFormat("video/hevc", 1280, 720);
                      f.setInteger(MediaFormat.KEY_COLOR_FORMAT,
                          MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                      f.setInteger(MediaFormat.KEY_BIT_RATE, 8000000);
                      f.setInteger(MediaFormat.KEY_FRAME_RATE, 30);
                      f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1);
                      f.setInteger(MediaFormat.KEY_PROFILE,
                          MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10);

                      if (Build.VERSION.SDK_INT >= 24) {
                          f.setInteger(MediaFormat.KEY_COLOR_STANDARD,
                              MediaFormat.COLOR_STANDARD_BT2020);
                          f.setInteger(MediaFormat.KEY_COLOR_RANGE,
                              MediaFormat.COLOR_RANGE_LIMITED);
                      }
                      if (Build.VERSION.SDK_INT >= 29) {
                          f.setInteger(MediaFormat.KEY_COLOR_TRANSFER,
                              MediaFormat.COLOR_TRANSFER_ST2084);
                      }

                      codec.configure(f, null, null,
                          android.media.MediaCodec.CONFIGURE_FLAG_ENCODE);

                      android.view.Surface surface = codec.createInputSurface();
                      codec.start();

                      Thread.sleep(300);

                      codec.stop();
                      surface.release();
                      codec.release();

                      out("KONFIGURASI BERHASIL.");
                      out("HEVC Main10 + BT.2020 + PQ/ST2084 aktif.");
                      out("Ini baru tes encoder, belum membuat video HDR.");
                  } catch (Throwable e) {
                      out("GAGAL KONFIGURASI:");
                      out(e.toString());
                  }
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDR2HDR-Akari-TEST4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
